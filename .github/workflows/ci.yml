name: Verify Doctor Service

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doctorService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and package without external services
        run: ./gradlew check buildZip --no-daemon
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-service-tests
          path: doctorService/build/reports/tests/test/
