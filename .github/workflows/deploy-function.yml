name: Deploy Doctor Function to AWS Lambda

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified ZIP to the configured AWS Lambda function"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  JAVA_VERSION: 17
  PROJECT_DIR: doctorService

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and package with the checked-in wrapper
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew check buildZip --no-daemon

      - name: Debug - List build directory contents
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "Build directory contents:"
          ls -R build

      - name: Configure AWS credentials
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda
        if: inputs.deploy
        env:
          EXECUTION_ROLE_ARN: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          FUNCTION_NAME=doctor-function
          HANDLER="com.ELEC5620.doctorService.config.AwsLambdaHandler::handleRequest"
          ZIP_FILE=build/distributions/doctorService-0.0.1-SNAPSHOT.zip

          echo "Using ZIP file: $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          if ! aws lambda get-function --function-name $FUNCTION_NAME &>/dev/null; then
            echo "Creating new function: $FUNCTION_NAME"
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --runtime java17 \
              --role "$EXECUTION_ROLE_ARN" \
              --handler $HANDLER \
              --zip-file fileb://$ZIP_FILE \
              --timeout 30 \
              --memory-size 512
          else
            echo "Updating existing function: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://$ZIP_FILE
          fi

          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated --function-name $FUNCTION_NAME
          echo "Lambda function update completed successfully."
